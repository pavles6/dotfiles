[".zsh/fzf-tab"]
    type = "archive"
    url = "https://github.com/Aloxaf/fzf-tab/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# zjstatus/zjframes are built against a specific zellij-tile version and panic
# on events from newer zellij (e.g. mouse hover, dj95/zjstatus#296), so track
# the latest release instead of committing the wasm. Force a refresh after a
# zellij upgrade with: chezmoi apply --refresh-externals
[".config/zellij/plugins/zjstatus.wasm"]
    type = "file"
    url = "https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm"
    refreshPeriod = "168h"

[".config/zellij/plugins/zjframes.wasm"]
    type = "file"
    url = "https://github.com/dj95/zjstatus/releases/latest/download/zjframes.wasm"
    refreshPeriod = "168h"
