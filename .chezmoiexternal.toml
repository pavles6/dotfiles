[".zsh/fzf-tab"]
    type = "archive"
    url = "https://github.com/Aloxaf/fzf-tab/archive/master.tar.gz"
    exact = true
    stripComponents = 1
    refreshPeriod = "168h"

# git-repo (not archive) so an existing clone is pulled in place, not replaced
["powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]
    pull.args = ["--ff-only"]

# zjstatus is built against a specific zellij-tile version and panics on events
# from newer zellij (e.g. mouse hover, dj95/zjstatus#296), so track the latest
# release instead of committing the wasm. Force a refresh after a zellij
# upgrade with: chezmoi apply --refresh-externals
[".config/zellij/plugins/zjstatus.wasm"]
    type = "file"
    url = "https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm"
    refreshPeriod = "168h"
